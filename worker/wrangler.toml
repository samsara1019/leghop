name = "leghop-worker"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# ⚠️ 배포본에서 Gemini 호출이 막힌다 (실측 2026-08-03)
#
# 한국에서 호출해도 Cloudflare가 홍콩(HKG) 콜로에서 Worker를 실행하고,
# 홍콩은 Gemini API 미지원 지역이라 400 FAILED_PRECONDITION
# "User location is not supported for the API use." 가 돌아온다.
# 6회 연속 HKG였으므로 우연이 아니다.
#
# `[placement] mode = "smart"` 도 시도했지만 여전히 HKG였다. Smart Placement는
# 지연 최적화용이라 지역 규제를 피하는 수단이 아니다.
#
# 그래서 배포본은 Gemini 경로가 동작하지 않는다. 대응:
#   · 로컬 개발: VITE_WORKER_URL=http://localhost:8787 (한국에서 직접 나가므로 정상)
#   · 배포 필요 시: 지역을 고정할 수 있는 곳으로 프록시를 옮긴다
#     (Vercel Functions region=iad1, 또는 Cloud Run us-central1)
# 앱은 Gemini 실패 시 규칙 기반 파서로 자동 대체되므로 기능이 죽지는 않는다.

[observability]
enabled = true

[vars]
GEMINI_MODEL = "gemini-3.6-flash"
# 배포 시 실제 도메인으로 교체할 것
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# GEMINI_API_KEY는 vars에 넣지 않는다. 아래로 등록:
#   npx wrangler secret put GEMINI_API_KEY
# 로컬 개발은 .dev.vars 파일 사용 (git에 올라가지 않음)
